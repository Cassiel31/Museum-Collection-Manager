{% extends "base.html" %}{% block title %}Exhibition | The Archive{% endblock %}{% block content %}<section class="welcome"><p class="eyebrow">THE ARCHIVE / EXHIBITIONS</p><h1>{{ 'Edit Exhibition.' if exhibition.get('exhibition_id') else 'Plan an Exhibition.' }}</h1></section>
<form class="module-form" method="post" action="{{ '/exhibitions/' ~ exhibition.exhibition_id ~ '/edit' if exhibition.get('exhibition_id') else '/exhibitions/add' }}"><label>Name *<input name="exhibition_name" required value="{{ exhibition.get('exhibition_name','') }}"></label><label>Location<input name="location" value="{{ exhibition.get('location','') }}"></label><label>Start date *<input type="date" name="start_date" required value="{{ exhibition.get('start_date','') }}"></label><label>End date *<input type="date" name="end_date" required value="{{ exhibition.get('end_date','') }}"></label><label>Status<select name="status">{% for s in statuses %}<option value="{{ s }}" {% if exhibition.get('status','Planned') == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="wide">Description<textarea name="description">{{ exhibition.get('description','') }}</textarea></label><div class="wide form-actions"><a href="/exhibitions">Cancel</a><button class="module-button">Save Exhibition</button></div></form>{% endblock %}
