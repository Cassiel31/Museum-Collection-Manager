{% extends "base.html" %}{% block title %}Institution | The Archive{% endblock %}{% block content %}<section class="welcome"><p class="eyebrow">THE ARCHIVE / PARTNERS</p><h1>{{ 'Edit Institution.' if institution.get('institution_id') else 'Add Institution.' }}</h1></section><form class="module-form" method="post" action="{{ '/institutions/' ~ institution.institution_id ~ '/edit' if institution.get('institution_id') else '/institutions/add' }}"><label>Name *<input name="institution_name" required value="{{ institution.get('institution_name','') }}"></label><label>Contact person<input name="contact_person" value="{{ institution.get('contact_person','') }}"></label><label>Email<input type="email" name="email" value="{{ institution.get('email','') }}"></label><label>Phone<input name="phone" value="{{ institution.get('phone','') }}"></label><label class="wide">Address<textarea name="address">{{ institution.get('address','') }}</textarea></label><div class="wide form-actions"><a href="/institutions">Cancel</a><button class="module-button">Save Institution</button></div></form>{% endblock %}
