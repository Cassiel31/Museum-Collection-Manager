{% extends "base.html" %}{% block title %}Artist | The Archive{% endblock %}{% block extra_css %}<link rel="stylesheet" href="/static/css/collection-module.css">{% endblock %}
{% block content %}<section class="welcome"><p class="eyebrow">THE ARCHIVE / PEOPLE</p><h1>{{ "Edit Artist." if artist.get("artist_id") else "Add an Artist." }}</h1></section>
<form class="module-form" method="post" action="{{ '/artists/' ~ artist.artist_id ~ '/edit' if artist.get('artist_id') else '/artists/add' }}"><label>Name *<input name="name" required value="{{ artist.get('name','') }}"></label><label>Birth year<input type="number" name="birth_year" value="{{ artist.get('birth_year') or '' }}"></label><label>Death year<input type="number" name="death_year" value="{{ artist.get('death_year') or '' }}"></label><label>Nationality<input name="nationality" value="{{ artist.get('nationality','') }}"></label><label class="wide">Biography<textarea name="biography">{{ artist.get('biography','') }}</textarea></label><div class="wide form-actions"><a href="/artists">Cancel</a><button class="module-button">Save Artist</button></div></form>{% endblock %}
