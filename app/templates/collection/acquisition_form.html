{% extends "base.html" %}{% block title %}Record Acquisition | The Archive{% endblock %}{% block extra_css %}<link rel="stylesheet" href="/static/css/collection-module.css">{% endblock %}
{% block content %}<section class="welcome"><p class="eyebrow">THE ARCHIVE / PROVENANCE</p><h1>{{ 'Edit Acquisition.' if acquisition else 'Record an Acquisition.' }}</h1></section><form class="module-form" method="post" action="{{ '/acquisitions/' ~ acquisition.acquisition_id ~ '/edit' if acquisition else '/acquisitions/add' }}"><label>Artifact *<select name="artifact_id" required><option value="">Choose artifact</option>{% for a in artifacts %}<option value="{{ a.artifact_id }}" {% if acquisition and acquisition.artifact_id == a.artifact_id %}selected{% endif %}>{{ a.title }}</option>{% endfor %}</select></label><label>Acquisition type *<select name="acquisition_type" required>{% for t in ["Donation","Purchase","Archaeological Discovery","Transfer","Bequest"] %}<option {% if acquisition and acquisition.acquisition_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><label>Date *<input type="date" name="acquisition_date" required value="{{ acquisition.acquisition_date if acquisition else '' }}"></label><label>Source name<input name="source_name" value="{{ acquisition.source_name if acquisition else '' }}"></label><label>Purchase price<input type="number" min="0" step="0.01" name="purchase_price" value="{{ acquisition.purchase_price if acquisition else '' }}"></label><label class="wide">Notes<textarea name="notes">{{ acquisition.notes if acquisition else '' }}</textarea></label><div class="wide form-actions"><a href="/acquisitions">Cancel</a><button class="module-button">Save Acquisition</button></div></form>{% endblock %}
