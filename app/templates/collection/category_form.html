{% extends "base.html" %}{% block title %}Category | The Archive{% endblock %}{% block extra_css %}<link rel="stylesheet" href="/static/css/collection-module.css">{% endblock %}
{% block content %}<section class="welcome"><p class="eyebrow">THE ARCHIVE / CLASSIFICATION</p><h1>{{ "Edit Category." if category.get("category_id") else "Add a Category." }}</h1></section><form class="module-form" method="post" action="{{ '/categories/' ~ category.category_id ~ '/edit' if category.get('category_id') else '/categories/add' }}"><label>Category name *<input name="category_name" required value="{{ category.get('category_name','') }}"></label><label class="wide">Description<textarea name="description">{{ category.get('description','') }}</textarea></label><div class="wide form-actions"><a href="/categories">Cancel</a><button class="module-button">Save Category</button></div></form>{% endblock %}
