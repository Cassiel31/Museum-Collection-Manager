{% extends "base.html" %}{% block title %}Collection | The Archive{% endblock %}{% block extra_css %}<link rel="stylesheet" href="/static/css/collection-module.css">{% endblock %}
{% block content %}<section class="welcome"><p class="eyebrow">THE ARCHIVE / CURATED GROUPS</p><h1>{{ "Edit Collection." if collection.get("collection_id") else "Create a Collection." }}</h1></section><form class="module-form" method="post" action="{{ '/collections/' ~ collection.collection_id ~ '/edit' if collection.get('collection_id') else '/collections/add' }}"><label>Name *<input name="name" required value="{{ collection.get('name','') }}"></label><label class="wide">Description<textarea name="description">{{ collection.get('description','') }}</textarea></label><div class="wide form-actions"><a href="/collections">Cancel</a><button class="module-button">Save Collection</button></div></form>{% endblock %}
