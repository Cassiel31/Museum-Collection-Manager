{% extends "base.html" %}{% block title %}Loan | The Archive{% endblock %}{% block content %}<section class="welcome"><p class="eyebrow">THE ARCHIVE / LOANS</p><h1>{{ 'Update Loan.' if loan.get('loan_id') else 'Record a Loan.' }}</h1></section><form class="module-form" method="post" action="{{ '/loans/' ~ loan.loan_id ~ '/edit' if loan.get('loan_id') else '/loans/add' }}"><label>Artifact *<select name="artifact_id" required>{% for a in artifacts %}<option value="{{ a.artifact_id }}" {% if loan.get('artifact_id') == a.artifact_id %}selected{% endif %}>{{ a.title }}</option>{% endfor %}</select></label><label>Institution *<select name="institution_id" required>{% for i in institutions %}<option value="{{ i.institution_id }}" {% if loan.get('institution_id') == i.institution_id %}selected{% endif %}>{{ i.institution_name }}</option>{% endfor %}</select></label><label>Loan date *<input type="date" name="loan_date" required value="{{ loan.get('loan_date','') }}"></label><label>Expected return *<input type="date" name="expected_return_date" required value="{{ loan.get('expected_return_date','') }}"></label><label>Actual return<input type="date" name="actual_return_date" value="{{ loan.get('actual_return_date','') or '' }}"></label><label>Status<select name="status">{% for s in statuses %}<option {% if loan.get('status','Pending') == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="wide">Notes<textarea name="notes">{{ loan.get('notes','') }}</textarea></label><div class="wide form-actions"><a href="/loans">Cancel</a><button class="module-button">Save Loan</button></div></form>{% endblock %}
